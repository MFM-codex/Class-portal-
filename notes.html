<main class="page">

  <div class="page-header">
    <span class="eyebrow">Jot it down</span>
    <h1>Notes</h1>
    <p>A shared scratchpad for the class. Saved on this device.</p>
  </div>

  <div class="note-toolbar">
    <span id="saveStatus">Saved</span>
    <button class="save-btn" id="saveNoteBtn">Save</button>
  </div>
  <textarea class="note-area" id="noteArea" placeholder="e.g. Digital Logic Design — Chapter 4: Combinational circuits use logic gates (AND, OR, NOT, NAND, NOR, XOR) with no memory element; output depends only on current input..."></textarea>

  <script>
    const noteArea = document.getElementById("noteArea");
    const saveStatus = document.getElementById("saveStatus");
    const saveBtn = document.getElementById("saveNoteBtn");
    const NOTES_KEY = "classPortalNotes";

    noteArea.value = localStorage.getItem(NOTES_KEY) || "";

    function saveNote() {
      localStorage.setItem(NOTES_KEY, noteArea.value);
      saveStatus.textContent = "Saved";
    }
    saveBtn.addEventListener("click", saveNote);
    noteArea.addEventListener("input", () => { saveStatus.textContent = "Unsaved changes..."; });
  </script>

</main>

<script src="js/app.js"></script>
